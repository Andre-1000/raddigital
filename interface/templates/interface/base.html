{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242472">
  <title>{% block titulo %}Sistema RAD{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'interface/css/estilo.css' %}">
  {% block cabecalho_extra %}{% endblock %}
</head>
<body>

{% block barra_topo %}
<header class="cabecalho-hero">
  <div class="cabecalho-hero__nav">
    <div style="display:flex; align-items:center; gap:1.1rem;">
      <button type="button" class="pilula" id="botao-voltar-topo" title="Voltar para a tela anterior">
        ← Voltar
      </button>
      <a class="pilula" href="{% url 'interface:inicio' %}" title="Ir para o início">
        Home
      </a>
      <a class="cabecalho-hero__marca" href="{% url 'interface:inicio' %}">
        <svg class="trilho" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#fffcff"/>
          <path d="M8 5v14M16 5v14" stroke="#242472" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 9h8M8 14h8" stroke="#fa5e13" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        RAD
      </a>
    </div>
    <div class="cabecalho-hero__acoes">
      <span id="indicador-conexao" class="pilula">Online</span>
      <span id="usuario-logado" class="pilula" style="display:none;"></span>
      <!-- 30/07/2026: so aparece quando ha sessao valida (ver JS abaixo) -->
      <a id="link-trocar-senha" class="pilula" href="{% url 'interface:trocar_senha' %}" style="display:none;">
        Trocar senha
      </a>
    </div>
  </div>
  <!-- 21/08/2026: telas administrativas preenchem este bloco com
       eyebrow + titulo + subtitulo (ver .cabecalho-hero__corpo em
       estilo.css); telas de preenchimento em campo deixam vazio, para
       nao gastar espaco vertical em mobile. -->
  {% block cabecalho_hero_corpo %}{% endblock %}
</header>
{% endblock %}

<main class="container-app">
  {% block conteudo %}{% endblock %}
</main>

<script src="{% static 'interface/js/auth.js' %}"></script>
<script src="{% static 'interface/js/db.js' %}"></script>
<script>
  // Indicador de conexão — atualizado em tempo real, sem esperar
  // requisição falhar (RG conforme EFD: dispositivo pode estar offline
  // desde a abertura da ferramenta).
  function atualizarIndicadorConexao() {
    const selo = document.getElementById('indicador-conexao');
    if (!selo) return;
    if (navigator.onLine) {
      selo.textContent = 'Online';
      selo.className = 'pilula';
    } else {
      selo.textContent = 'Offline';
      selo.className = 'pilula pilula--atencao';
    }
  }
  window.addEventListener('online', atualizarIndicadorConexao);
  window.addEventListener('offline', atualizarIndicadorConexao);
  atualizarIndicadorConexao();

  document.addEventListener('DOMContentLoaded', function () {
    const info = RadAuth.obterSessao();
    const rotuloUsuario = document.getElementById('usuario-logado');
    const linkTrocarSenha = document.getElementById('link-trocar-senha');
    if (info && rotuloUsuario) {
      rotuloUsuario.textContent = info.login;
      rotuloUsuario.style.display = '';
      if (linkTrocarSenha) linkTrocarSenha.style.display = '';
    }

    // Botao "Voltar": usa o historico do navegador quando ha para onde
    // voltar dentro do proprio site; caso contrario (ex.: pessoa abriu
    // a tela direto por um link), manda para o Inicio em vez de sair
    // do site ou nao fazer nada.
    const botaoVoltar = document.getElementById('botao-voltar-topo');
    if (botaoVoltar) {
      botaoVoltar.addEventListener('click', function () {
        if (document.referrer && document.referrer.startsWith(window.location.origin) && window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '{% url "interface:inicio" %}';
        }
      });
    }
  });

  // Registra o Service Worker (app shell offline, RG-SYNC-001/010/011).
  // Sem suporte a Service Worker (navegador muito antigo), a ferramenta
  // continua funcionando normalmente -- so nao fica disponivel offline
  // na primeira abertura apos fechar o navegador.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (erro) {
        console.warn('Nao foi possivel registrar o Service Worker:', erro);
      });
    });
  }
</script>
{% block script_extra %}{% endblock %}
</body>
</html>
